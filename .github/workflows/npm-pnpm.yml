# pnpm with a lockfile.
#
# pnpm reads the npm configuration that Harden-Runner writes, so with
# pnpm-lock.yaml every package is downloaded through Secure Registry.
#
# pnpm/action-setup installs pnpm itself with npm, so that goes through Secure
# Registry as well. If a pnpm release is newer than the cooldown, the job
# summary lists it under Held. That is expected and does not fail the job.
name: "npm: 7. pnpm"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/pnpm
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          secure-registry: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # A restored dependency cache is never checked by Secure Registry.
          package-manager-cache: false

      - name: Check that pnpm uses Secure Registry
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/require-secure-registry.sh" pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
