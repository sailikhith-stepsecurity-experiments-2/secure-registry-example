# Cooldown and cooldown exemptions.
#
# The cooldown hides versions published less than N days ago (2 by default).
# Most malicious versions are found and removed within hours, so waiting a
# short time before installing a new release avoids most of them.
#
# This workflow installs the latest nightly build of TypeScript
# (typescript@next), which is usually less than a day old:
#   - "held": default settings. npm cannot see the version, so the install fails.
#   - "exempted": the same install, with TypeScript exempted from the cooldown.
name: "npm: 2. Cooldown and exemptions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          secure-registry: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that npm uses Secure Registry
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/require-secure-registry.sh" npm

      - name: Find the latest nightly TypeScript
        id: nightly
        run: .github/scripts/npm/typescript-nightly.sh

      - name: Install it (held by the cooldown)
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.nightly.outputs.version }}
          AGE_DAYS: ${{ steps.nightly.outputs.age-days }}
        run: |
          if npm install --no-save "typescript@$VERSION" > install.log 2>&1; then
            cat install.log
            if [ "$AGE_DAYS" -lt 2 ]; then
              echo "::error title=Not held::typescript@$VERSION is newer than the 2-day cooldown, but it was installed."
              exit 1
            fi
            echo "::warning title=Nothing held::typescript@$VERSION is older than the cooldown, so it was installed. Run this workflow again after the next nightly build."
            exit 0
          fi
          cat install.log
          if ! grep -q "hidden by your registry policy" install.log; then
            echo "::error title=Unexpected error::The install failed, but not because of the cooldown."
            exit 1
          fi
          echo "::notice title=Held as expected::typescript@$VERSION is newer than the cooldown."

  exempted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          secure-registry: |
            npm:
              cooldown:
                days: 2
                exemptions:
                  # Every version of a package. To allow a single release
                  # instead, name the version, for example "left-pad@1.3.0".
                  - "typescript@*"
                  # Every package in a scope. TypeScript nightlies depend on
                  # platform packages such as @typescript/typescript-linux-x64,
                  # which are published at the same time.
                  - "@typescript/*"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that npm uses Secure Registry
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/require-secure-registry.sh" npm

      - name: Find the latest nightly TypeScript
        id: nightly
        run: .github/scripts/npm/typescript-nightly.sh

      - name: Install it (exempted from the cooldown)
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.nightly.outputs.version }}
        run: |
          npm install --no-save "typescript@$VERSION"
          npx --no-install tsc --version
