# Audit mode.
#
# Packages still go through Secure Registry, but nothing is refused. The job
# summary lists what would have been blocked in enforce mode. Use it to try
# Secure Registry on an existing project without breaking builds.
#
# ecosystem-defaults applies to every supported ecosystem, so this one setting
# keeps working as ecosystems are added. The block list matches the
# "npm: 3. Block list" workflow: here npm ci succeeds, and ms@2.1.3 is listed
# as "would be blocked" in the job summary.
name: "npm: 5. Audit mode"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/app
    steps:
      - name: Print job summaries (test copy only)
        uses: sailikhith-stepsecurity-experiments-2/repo-1/.github/actions/dump-summary@main

      - name: Harden the runner
        uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12.1-binding-summary # test copy: int build
        with:
          egress-policy: audit
          secure-registry: |
            ecosystem-defaults:
              mode: audit
            npm:
              block-list:
                - "ms@2.1.3"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # A restored dependency cache is never checked by Secure Registry.
          package-manager-cache: false

      - name: Check that npm uses Secure Registry
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/require-secure-registry.sh" npm

      - name: Install dependencies (not blocked in audit mode)
        run: npm ci

      - name: Test
        run: npm test

      - name: Wait for Secure Registry rows (test copy only)
        run: sleep 30
