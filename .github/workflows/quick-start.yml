# Quick start: Secure Registry with the default settings.
#
# Every npm install in this job goes through StepSecurity Secure Registry:
# known compromised versions are refused, and versions published less than
# 2 days ago are held back by the cooldown.
name: 1. Quick start

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # optional, recommended: lets GitHub vouch for this repository
    steps:
      # Harden-Runner must be the first step, so that every later step uses Secure Registry.
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          secure-registry: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # A restored dependency cache is never checked by Secure Registry.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test
