# Compromised packages.
#
# Versions that StepSecurity has flagged as compromised are always refused.
# This protection is always on and cannot be exempted.
#
# npm/compromised pins @harden-runner-canary/basic-npm-package@1.5.0, a
# StepSecurity test package that is flagged as compromised on purpose. It is
# harmless: it has no install scripts and only exports a "Hello, world!" function.
name: "npm: 4. Compromised package"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/compromised
    steps:
      - name: Print job summaries (test copy only)
        uses: sailikhith-stepsecurity-experiments-2/repo-1/.github/actions/dump-summary@main

      - name: Harden the runner
        uses: sailikhith-stepsecurity/harden-runner@int/sr-ci-12.1-binding-summary # test copy: int build
        with:
          egress-policy: audit
          secure-registry: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # A restored dependency cache is never checked by Secure Registry.
          package-manager-cache: false

      - name: Check that npm uses Secure Registry
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/require-secure-registry.sh" npm

      # The lockfile pins the compromised version, so the download is refused.
      - name: Install from the lockfile (refused)
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/expect-refused.sh" "is blocked by security policy with StepSecurity" npm ci

      # Without a lockfile, npm cannot see the compromised version and prints
      # a notice that names it.
      - name: Install the version by name (hidden)
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/expect-refused.sh" "hidden by your registry policy" npm install --no-save @harden-runner-canary/basic-npm-package@1.5.0

      - name: Wait for Secure Registry rows (test copy only)
        run: sleep 30
