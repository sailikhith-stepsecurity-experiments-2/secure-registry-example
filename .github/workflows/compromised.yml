# Compromised packages.
#
# Versions that StepSecurity has flagged as compromised are always refused.
# This protection is always on and cannot be exempted.
#
# examples/compromised pins @harden-runner-canary/basic-npm-package@1.5.0, a
# StepSecurity test package that is flagged as compromised on purpose. It is
# harmless: it has no install scripts and only exports a "Hello, world!" function.
name: 4. Compromised package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          secure-registry: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # The lockfile pins the compromised version, so the download is refused.
      - name: Install from the lockfile (refused)
        working-directory: examples/compromised
        run: ../../.github/scripts/expect-refused.sh "E403" npm ci

      # Without a lockfile, npm cannot see the compromised version and prints
      # a notice that names it.
      - name: Install the version by name (hidden)
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.github/scripts/expect-refused.sh" "hidden by your registry policy" npm install --no-save @harden-runner-canary/basic-npm-package@1.5.0
