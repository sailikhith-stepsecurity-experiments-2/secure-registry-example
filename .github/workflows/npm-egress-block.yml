# Secure Registry with an egress block policy.
#
# With egress-policy: block, Harden-Runner allows Secure Registry
# automatically. registry.npmjs.org is not in allowed-endpoints, so nothing in
# the job can download packages around Secure Registry.
name: "npm: 6. Egress block"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm/app
    steps:
      - name: Print job summaries (verification copy only)
        uses: sailikhith-stepsecurity-experiments-2/repo-1/.github/actions/dump-summary@main

      - name: Harden the runner
        uses: step-security/harden-runner@rc-49 # prod verification copy
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
          secure-registry: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the Node.js that is preinstalled on the runner, so no download
      # endpoint has to be allowed.
      - name: Node.js version
        run: node --version

      - name: Check that npm uses Secure Registry
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/require-secure-registry.sh" npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: The public npm registry is not reachable
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/expect-refused.sh" "curl: \(" curl -fsS --max-time 15 https://registry.npmjs.org/
